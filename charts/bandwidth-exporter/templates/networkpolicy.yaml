{{- if .Values.networkPolicy.enabled }}
# Only the scrapers reach the metrics port. Egress is left open: the tests go to the Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bandwidth-exporter.fullname" . }}
  labels:
    {{- include "bandwidth-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bandwidth-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
{{- end }}
