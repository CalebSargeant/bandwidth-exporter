# bandwidth-exporter: scheduled bandwidth tests with the cached results on /metrics. A scrape
# never starts a test. See the repository README for the metrics and the design.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/calebsargeant/bandwidth-exporter
  # Defaults to the chart's appVersion.
  tag: ""
  # sha256:... When set it pins the image and wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

workload:
  # Deployment: one tester, replaced with Recreate so a rollout never runs two at once. The
  #   north/south shape: one tester per WAN egress.
  # StatefulSet: the same with a strict at-most-one guarantee, at the price of manual recovery
  #   from a lost node.
  # DaemonSet: one instance per node, each an agent and a responder, for east/west tests across
  #   the cluster (see `mesh`). North/south tests then run on `northSouthOn` only.
  kind: Deployment

# The exporter's config.yaml, rendered into a ConfigMap. The chart sets `listen`, `state_dir`,
# `network_mode`, the responder's listener and ports, and the mesh test below. With no tests the
# exporter runs and measures nothing: name a target to start.
#
# Quick start against Cloudflare's speed test (no published terms for programmatic use, so keep
# it infrequent):
#   north_south:
#     - name: cloudflare
#       backend: cloudflare
#       schedule: {random: {mean: 6h, min: 2h, max: 15h}}
#
# Your own iperf3 server (the recommended production target):
#   north_south:
#     - name: oci-fra
#       backend: iperf3
#       target: iperf.example.net:5201
#
# No test starts in business hours (a test saturates the link it measures):
#   business_hours: {timezone: Europe/Amsterdam, days: [mon, tue, wed, thu, fri],
#                    start: "07:00", end: "19:00"}
config:
  north_south: []
  # defaults:
  #   schedule: {random: {mean: 4h, min: 1h, max: 12h}}
  #   warmup: auto
  #   duration: 10s
  #   max_duration: 15s
  #   streams: 4
  # budget:
  #   limit: 500GB   # past it, runs are skipped until the period resets
  #   reset_day: 1
  log_format: json

# Use your own ConfigMap (key config.yaml) instead of `config`.
existingConfigMap: ""

# Address the exporter binds inside the pod. Use "::" on IPv6-only clusters.
listenAddress: 0.0.0.0

# For the headless Service's DNS name that east/west discovery resolves.
clusterDomain: cluster.local

# This instance's peer id for Deployments and StatefulSets (the release's full name when empty).
# DaemonSet pods use their node's name.
peerId: ""

# DaemonSet mode: the node whose instance runs the north/south tests. Every node leaving through
# the same egress would otherwise test it at once.
northSouthOn: ""

# The responder answers peers' east/west tests: a signed control API plus single-use data ports.
responder:
  enabled: false
  port: 10057
  dataPorts:
    first: 5201
    last: 5210
  # More sources allowed to reach the responder (other sites over a VPN), as NetworkPolicy peers.
  # The pods of this release are always allowed.
  allowFrom: []

# Peer keys for east/west tests and the responder, from a Secret you create (an ExternalSecret).
# `key` signs this instance's requests (BWEXP_PEER_KEY); `keys` is what the responder accepts
# (BWEXP_PEER_KEYS): the same shared key, or a JSON object of peer id to key. At least 16
# characters, e.g. `openssl rand -hex 32`.
peerKeys:
  existingSecret: ""
  keyKey: key
  # Empty: the responder accepts the same shared key the agent signs with.
  keysKey: ""

# An east/west test against the other pods of this release, found through the headless Service
# the chart creates. Needs the responder and the peer key. Each instance tests `randomPeers`
# others, picked by rendezvous hashing (unset for a full mesh: N x (N-1) pairs).
mesh:
  enabled: false
  name: cluster-mesh
  backend: builtin
  randomPeers: 3
  schedule:
    random: {mean: 6h, min: 1h, max: 12h}
  # Any other east_west test field (streams, duration, directions, ...).
  extra: {}

# POST /api/v1/tests/{name}/run, off unless config.trigger.enabled is true. The bearer token comes
# from this Secret, never from values.
trigger:
  existingSecret: ""
  secretKey: token

extraEnv: []
extraEnvFrom: []

service:
  type: ClusterIP
  port: 10056
  annotations: {}

serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  # kube-prometheus-stack selects monitors by its release label unless told otherwise.
  labels: {}
  # Added after the chart's own relabeling, which copies the pod's node into a `node` label.
  relabelings: []
  metricRelabelings: []

prometheusRule:
  enabled: false
  labels: {}
  # No success for this long (and the exporter has been up at least this long). Two of the
  # longest gaps the schedule allows, plus slack; business hours stretch the gaps further.
  staleAfterHours: 32
  severity: warning
  # Every north/south result in a day below this share of the plan (needs `plan` on the test).
  belowPlanRatio: 0.7
  # Optional recording rules so grafana.com dashboard 13665 works unchanged for one test.
  compatDashboard13665:
    enabled: false
    test: ""

# A Grafana dashboard as a ConfigMap for the Grafana sidecar.
dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations: {}
  # Default datasource uid of the dashboard's datasource variable; "default" is Grafana's default.
  datasourceUid: default

networkPolicy:
  enabled: false
  # Who may reach the metrics port. Egress stays open: tests go to the Internet by design.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Nothing in this version talks to the Kubernetes API.
  automountToken: false

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# Measure the node's path instead of the pod network's. Fails the Baseline Pod Security Standard.
hostNetwork: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# A CPU request and deliberately no CPU limit: CFS throttling caps measured throughput almost
# exactly in proportion, so a CPU limit shows up as a slow network. Size the request to the line
# rate (about 0.1 core per Gbit/s for each end) where nodes are busy.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 384Mi

# The state file (last results, schedule, budget). With an emptyDir it survives container
# restarts but not rescheduling; a claim keeps it across both. Not for DaemonSets.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  size: 64Mi
  accessModes:
    - ReadWriteOnce

# Longer than a test, so SIGTERM can stop one cleanly.
terminationGracePeriodSeconds: 60

livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
