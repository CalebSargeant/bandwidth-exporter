apiVersion: v2
name: bandwidth-exporter
description: >-
  Scheduled bandwidth tests with cached results for Prometheus: north/south to Cloudflare or your
  own iperf3 server, east/west between instances that answer each other. A scrape never starts a
  test, and business hours can be kept free of tests.
type: application
version: 0.3.0
appVersion: "0.3.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/CalebSargeant/bandwidth-exporter
sources:
  - https://github.com/CalebSargeant/bandwidth-exporter
keywords:
  - prometheus
  - exporter
  - bandwidth
  - speedtest
  - iperf3
maintainers:
  - name: Caleb Sargeant
    url: https://github.com/CalebSargeant
