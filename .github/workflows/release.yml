name: Release

# Push a tag vX.Y.Z (matching pyproject, the package and the chart) to publish:
# - a multi-arch image to ghcr.io/<owner>/bandwidth-exporter, signed with cosign (keyless);
# - the chart to oci://ghcr.io/<owner>/charts/bandwidth-exporter;
# - a GitHub release listing both digests, which is what deployments should pin.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        name: The tag, the package and the chart agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          project=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/bandwidth_exporter/__init__.py)
          chart=$(yq '.version' charts/bandwidth-exporter/Chart.yaml)
          app=$(yq '.appVersion' charts/bandwidth-exporter/Chart.yaml)
          echo "tag=$version pyproject=$project package=$package chart=$chart appVersion=$app"
          for found in "$project" "$package" "$chart" "$app"; do
            [ "$found" = "$version" ] || { echo "version mismatch" >&2; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Multi-arch: edge sites run small arm64 hosts.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${image}@${DIGEST}"

  chart:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - id: push
        name: Package and push the chart
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # OCI repository names must be lower case; the owner keeps its display casing.
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          helm package charts/bandwidth-exporter --destination "$RUNNER_TEMP"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/bandwidth-exporter-*.tgz "oci://ghcr.io/${owner}/charts" 2>&1 \
            | tee "$RUNNER_TEMP/push.log"
          digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/push.log")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  github-release:
    needs: [versions, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.versions.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          image=$(echo "ghcr.io/$REPO" | tr '[:upper:]' '[:lower:]')
          cat > notes.md <<EOF
          Image: \`${image}:${VERSION}@${IMAGE_DIGEST}\`

          Chart: \`oci://ghcr.io/${owner}/charts/bandwidth-exporter:${VERSION}@${CHART_DIGEST}\`
          EOF
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md --generate-notes
